name: validate

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -euo pipefail
          for f in start.sh stop.sh status.sh logs.sh smoke.sh \
                   scripts/prepare-model.sh scripts/prepare-tp3-model-dir.sh \
                   scripts/build-image.sh scripts/build-mesh-plugin.sh; do
            bash -n "$f"
          done
      - name: compose YAML
        run: python3 -c "import pathlib; from pathlib import Path; Path('docker-compose.yml').read_text()"
      - name: python suites (need >=3.10 for PEP-604 in vendored hotfixes)
        run: |
          set -euo pipefail
          python3 --version
          for t in test-dspark-api-keys.py test-env-normalisation.py \
                   test-redact-api-key-log.py test-hotfix-atomic-transaction.py; do
            echo "::group::$t"
            python3 "scripts/$t"
            echo "::endgroup::"
          done
      - name: bash suites
        run: |
          set -euo pipefail
          bash scripts/test-draft-sample-method-gate.sh
      - name: no lab PII in tracked files
        run: |
          set -euo pipefail
          if git grep -nE 'kapic|100\.89\.|tailscale|spark-84b2|spark-1958|gx10-fe6d|models\.kapic' -- . \
              ':!.github/workflows/validate.yml'; then
            echo "refusing to ship lab PII" >&2
            exit 1
          fi
